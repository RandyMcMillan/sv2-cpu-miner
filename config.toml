# Sv2 CPU miner configuration.
#
# Load with:
#   cargo run -- -c config.toml
#
# Any field can be overridden with CPU_MINER__<FIELD>, for example:
#   CPU_MINER__SERVER_ADDR=pool.example:3333
#   CPU_MINER__N_STANDARD_CHANNELS=1
#   CPU_MINER__CPU_USAGE_PERCENT=50
#   CPU_MINER__SINGLE_SUBMIT=true

# --- Connection ---
# Mining pool address in host:port form. Host may be a DNS name, IPv4 address,
# or bracketed IPv6 address.
server_addr = "127.0.0.1:3333"

# Optional public key of the mining server. Omit or leave unset to connect
# without server authentication.
# auth_pk = "9auqWEzQDVyd2oe1JVGFLMLHZtCo2FFqZwtKA5gd9xbuEu7PH72"

# --- Channels ---
# Number of extended Sv2 channels to open.
# Valid: 0..=255. At least one of n_extended_channels/n_standard_channels > 0.
n_extended_channels = 0

# Number of standard Sv2 channels to open.
# Valid: 0..=255. At least one of n_extended_channels/n_standard_channels > 0.
n_standard_channels = 4

# When true, request standard jobs instead of extended jobs. Requires
# n_extended_channels = 0.
requires_standard_jobs = true

# --- Miner identity ---
# User identity sent in channel opening messages. Max 255 bytes.
user_identity = "username"

# Device id sent in the setup connection. Max 255 bytes.
device_id = "cpu_miner_sv2"

# --- Mining behavior ---
# Stop hashing a job after submitting its first share on each channel.
single_submit = false

# CPU usage percentage. Valid: 1..=100.
cpu_usage_percent = 100

# Multiplier applied to the advertised nominal hashrate. Valid: > 0.0.
nominal_hashrate_multiplier = 1.0

# --- Logging ---
# Optional log file. Logs always go to stdout too.
# log_file = "cpu_miner_sv2.log"
